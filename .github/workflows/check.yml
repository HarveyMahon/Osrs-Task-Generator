name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generator checks
        run: node scripts/check_generator.js

      - name: Refresh script against recorded responses (no network)
        run: |
          cp -r data "$RUNNER_TEMP/data"
          python3 scripts/update_data.py --fixtures scripts/fixtures --remap --data-dir "$RUNNER_TEMP/data"
